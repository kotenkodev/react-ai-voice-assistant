<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#05070d" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark container with subtle gradient border -->
  <rect width="64" height="64" rx="18" fill="url(#bgGrad)" />
  <rect x="1" y="1" width="62" height="62" rx="17" stroke="url(#accentGrad)" stroke-width="1.5" stroke-opacity="0.5" />

  <!-- Acoustic ring -->
  <circle cx="32" cy="32" r="23" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.4" />

  <!-- Glowing Microphone AI Voice Core -->
  <g filter="url(#glow)">
    <!-- Mic capsule -->
    <rect x="26" y="16" width="12" height="20" rx="6" fill="url(#accentGrad)" />

    <!-- Sound grill slits -->
    <line x1="29" y1="21" x2="35" y2="21" stroke="#ffffff" stroke-width="1" stroke-linecap="round" opacity="0.7" />
    <line x1="28" y1="25" x2="36" y2="25" stroke="#ffffff" stroke-width="1" stroke-linecap="round" opacity="0.7" />
    <line x1="29" y1="29" x2="35" y2="29" stroke="#ffffff" stroke-width="1" stroke-linecap="round" opacity="0.7" />

    <!-- Mic cradle arc -->
    <path d="M21 28C21 34.075 25.925 39 32 39C38.075 39 43 34.075 43 28" stroke="url(#accentGrad)" stroke-width="2.5" stroke-linecap="round" />

    <!-- Stem and stand base -->
    <path d="M32 39V45" stroke="url(#accentGrad)" stroke-width="2.5" stroke-linecap="round" />
    <path d="M25 46H39" stroke="url(#accentGrad)" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Live Pulse Sparkle Accent -->
  <circle cx="43" cy="18" r="3" fill="#38bdf8" />
  <circle cx="43" cy="18" r="5" stroke="#38bdf8" stroke-width="1" opacity="0.5" />
</svg>
